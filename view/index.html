<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三维视口</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 中部三维视口：three.js 画布挂 #scene-host；未导入模型时 #empty-scene 空态卡覆盖其上。
       几何/拾取/路径由 T05-T07 接入；本文件只放骨架与 <script> 注册（04 §4.5-③）。 -->
  <main id="viewport">
    <div id="scene-host"></div>
    <section id="empty-scene" class="card">
      <h1>三维视口</h1>
      <p>把 STEP / IGES / STL 文件拖到这里</p>
      <p class="dim">或点右栏【选择模型文件】</p>
      <p id="bridge-state" class="dim">桥：未连接</p>
    </section>
  </main>

  <!-- 脚本注册行（qwebchannel.js 为 QtWebEngine 内置离线资源，非 CDN）。
       loader.js 必须在 bridge.js 之后：它包裹 bridge.js 注册的 window.__mecharm_dispatch。
       pick.js（T06）必须在 loader.js 之后：它再次包裹 __mecharm_dispatch、截走 pick.enable/invalidate，
       path.js（T07）又必须在 pick.js 之后：它再次包裹 __mecharm_dispatch、截走 path.show/pose.update，
       故注册顺序为 bridge→loader→pick→path。 -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="module" src="js/bridge.js"></script>
  <script type="module" src="js/loader.js"></script>
  <script type="module" src="js/pick.js"></script>
  <script type="module" src="js/path.js"></script>
</body>
</html>
