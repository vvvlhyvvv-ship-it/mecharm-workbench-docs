# tests/fixtures/bad_modes.yaml —— 非法样例④「modes 子集校验两处错」
# 注入两处缺陷：
#   modes[0].axes 含 GHOST（不在 axes 表内）
#   modes[1].axes 含 10 个轨迹级轴 X1~X10（> 上限 9，即 TRAJECTORY_AXES_MAX）
# 期望：共 2 项问题，消息含「轴 id 不在 axes 表内」与「轨迹级轴 10 个 > 上限 9」。
machine: {name: 最小样例, schema_ver: "1.0"}

axes:
  - {id: X1, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X2, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X3, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X4, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X5, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X6, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X7, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X8, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X9, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: X10, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  # ↓ 工序级轴：不计入轨迹级上限（用来验证只数 trajectory）
  - {id: YA, type: revolute, role: setup, travel: [-90.0, 90.0], zero_offset_deg: 0.0,
     direction: 1, scale: null, coupling: null}

modes:
  # ↓ GHOST 不存在
  - {id: grind, name: 打磨, axes: [X1, GHOST]}
  # ↓ 轨迹级 10 个，超上限 9
  - {id: over, name: 超限模式, axes: [X1, X2, X3, X4, X5, X6, X7, X8, X9, X10]}

# G18 两键：base 无驱动轴（axis／motion 双 null）；gantry 绑 X1（8 个样例里 X1 均无注入
# 缺陷），故本样例的问题项数仍只有 modes 那两处（GHOST 轴＋轨迹级轴超上限）。
links:
  - {id: base, length_mm: 0.0, parent: null, axis: null, motion: null}
  - {id: gantry, length_mm: 100.0, parent: base, axis: X1, motion: x}

limits: {speed_max_mm_s: 100.0, speed_rapid_mm_s: 80.0, speed_work_mm_s: 10.0,
         accel_max_mm_s2: 500.0, clearance_warn_mm: 20.0, collision_envelope_mm: 3.0,
         tessellate_deflection_mm: 0.5, path_sample_step_mm: 50.0}

opcua:
  endpoint_url: "opc.tcp://127.0.0.1:4840"
  security_policy: "None"
  ns_index: 3
  pack_profile: v1_2_8axis
  read_nodes:
    axis_pos: ['ns=3;s="DB_PLC_to_SW"."Pos[0]"', 'ns=3;s="DB_PLC_to_SW"."Pos[1]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[2]"', 'ns=3;s="DB_PLC_to_SW"."Pos[3]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[4]"', 'ns=3;s="DB_PLC_to_SW"."Pos[5]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[6]"', 'ns=3;s="DB_PLC_to_SW"."Pos[7]"']
    axis_vel: ['ns=3;s="DB_PLC_to_SW"."Vel[0]"', 'ns=3;s="DB_PLC_to_SW"."Vel[1]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[2]"', 'ns=3;s="DB_PLC_to_SW"."Vel[3]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[4]"', 'ns=3;s="DB_PLC_to_SW"."Vel[5]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[6]"', 'ns=3;s="DB_PLC_to_SW"."Vel[7]"']
    status: 'ns=3;s="DB_PLC_to_SW"."Status"'
    heartbeat: 'ns=3;s="DB_PLC_to_SW"."Heartbeat"'
    ack: 'ns=3;s="DB_PLC_to_SW"."Ack"'
    alarm_word: 'ns=3;s="DB_PLC_to_SW"."AlarmWord"'
    seq_id: 'ns=3;s="DB_PLC_to_SW"."SeqID"'
    cur_seg: 'ns=3;s="DB_PLC_to_SW"."CurSeg"'
  write_nodes:
    cmd: 'ns=3;s="DB_SW_to_PLC"."Cmd"'
    seq_id: 'ns=3;s="DB_SW_to_PLC"."SeqID"'
    seg_count: 'ns=3;s="DB_SW_to_PLC"."SegCount"'
    speed_override: 'ns=3;s="DB_SW_to_PLC"."SpeedOverride"'
    seg_array: 'ns=3;s="DB_SW_to_PLC"."Seg"'
  publish_interval_ms: 50

paths:
  cache_dir: '%LOCALAPPDATA%\mecharm\cache-test'
