# tests/fixtures/bad_travel.yaml —— 非法样例③「行程 min ≥ max」
# 注入一处缺陷：轴 X9 的 travel 写成 [100.0, 0.0]（min > max）。
# 期望：ConfigError 消息含 `travel` 与「min 必须 < max」及实得区间。
machine: {name: 最小样例, schema_ver: "1.0"}

axes:
  - {id: X1, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: RA, type: revolute, role: trajectory, travel: [-90.0, 90.0], zero_offset_deg: 0.0,
     direction: -1, scale: 0.001, coupling: {type: ratio, master: X1, ratio: 2.0}}
  # ↓ min > max
  - {id: X9, type: prismatic, role: trajectory, travel: [100.0, 0.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}

modes:
  - {id: grind, name: 打磨, axes: [X1, RA]}

links:
  - {id: base, length_mm: 0.0, parent: null}
  - {id: gantry, length_mm: 100.0, parent: base}

limits: {speed_max_mm_s: 100.0, speed_rapid_mm_s: 80.0, speed_work_mm_s: 10.0,
         accel_max_mm_s2: 500.0, clearance_warn_mm: 20.0, collision_envelope_mm: 3.0,
         tessellate_deflection_mm: 0.5, path_sample_step_mm: 50.0}

opcua:
  endpoint_url: "opc.tcp://127.0.0.1:4840"
  security_policy: "None"
  ns_index: 3
  pack_profile: v1_2_8axis
  read_nodes:
    axis_pos: ['ns=3;s="DB_PLC_to_SW"."Pos[0]"', 'ns=3;s="DB_PLC_to_SW"."Pos[1]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[2]"', 'ns=3;s="DB_PLC_to_SW"."Pos[3]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[4]"', 'ns=3;s="DB_PLC_to_SW"."Pos[5]"',
               'ns=3;s="DB_PLC_to_SW"."Pos[6]"', 'ns=3;s="DB_PLC_to_SW"."Pos[7]"']
    axis_vel: ['ns=3;s="DB_PLC_to_SW"."Vel[0]"', 'ns=3;s="DB_PLC_to_SW"."Vel[1]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[2]"', 'ns=3;s="DB_PLC_to_SW"."Vel[3]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[4]"', 'ns=3;s="DB_PLC_to_SW"."Vel[5]"',
               'ns=3;s="DB_PLC_to_SW"."Vel[6]"', 'ns=3;s="DB_PLC_to_SW"."Vel[7]"']
    status: 'ns=3;s="DB_PLC_to_SW"."Status"'
    heartbeat: 'ns=3;s="DB_PLC_to_SW"."Heartbeat"'
    ack: 'ns=3;s="DB_PLC_to_SW"."Ack"'
    alarm_word: 'ns=3;s="DB_PLC_to_SW"."AlarmWord"'
    seq_id: 'ns=3;s="DB_PLC_to_SW"."SeqID"'
    cur_seg: 'ns=3;s="DB_PLC_to_SW"."CurSeg"'
  write_nodes:
    cmd: 'ns=3;s="DB_SW_to_PLC"."Cmd"'
    seq_id: 'ns=3;s="DB_SW_to_PLC"."SeqID"'
    seg_count: 'ns=3;s="DB_SW_to_PLC"."SegCount"'
    speed_override: 'ns=3;s="DB_SW_to_PLC"."SpeedOverride"'
    seg_array: 'ns=3;s="DB_SW_to_PLC"."Seg"'
  publish_interval_ms: 50

paths:
  cache_dir: '%LOCALAPPDATA%\mecharm\cache-test'
