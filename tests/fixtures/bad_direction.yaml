# tests/fixtures/bad_direction.yaml —— 非法样例④「direction 非 ±1」
# 注入一处缺陷：轴 X9 的 direction 写成 2。
# 期望：ConfigError 消息含 `direction` 与「应为 1 或 -1」。
# 依据：方向符号是标定四要素之一，契约 §7.4 明确「必须现场实测，不得推断」，故只收 ±1。
machine: {name: 最小样例, schema_ver: "1.0"}

axes:
  - {id: X1, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 1, scale: null, coupling: null}
  - {id: RA, type: revolute, role: trajectory, travel: [-90.0, 90.0], zero_offset_deg: 0.0,
     direction: -1, scale: 0.001, coupling: {type: ratio, master: X1, ratio: 2.0}}
  # ↓ direction 只允许 1 或 -1
  - {id: X9, type: prismatic, role: trajectory, travel: [0.0, 100.0], zero_offset_mm: 0.0,
     direction: 2, scale: null, coupling: null}

modes:
  - {id: grind, name: 打磨, axes: [X1, RA]}

links:
  - {id: base, length_mm: 0.0, parent: null}
  - {id: gantry, length_mm: 100.0, parent: base}

limits: {speed_max_mm_s: 100.0, speed_rapid_mm_s: 80.0, speed_work_mm_s: 10.0,
         accel_max_mm_s2: 500.0, clearance_warn_mm: 20.0, collision_envelope_mm: 3.0,
         tessellate_deflection_mm: 0.5, path_sample_step_mm: 50.0}

opcua:
  endpoint_url: "opc.tcp://127.0.0.1:4840"
  security_policy: "None"
  ns_index: 3
  pack_profile: v1_2_8axis
  read_nodes:
    axis_pos: ['ns=3;s="DB_PLC_to_SW"."Pos[0]"']
    status: 'ns=3;s="DB_PLC_to_SW"."Status"'
    heartbeat: 'ns=3;s="DB_PLC_to_SW"."Heartbeat"'
  write_nodes:
    cmd: 'ns=3;s="DB_SW_to_PLC"."Cmd"'
    seg_count: 'ns=3;s="DB_SW_to_PLC"."SegCount"'
    seg_array: 'ns=3;s="DB_SW_to_PLC"."Seg"'
  publish_interval_ms: 50

paths:
  cache_dir: '%LOCALAPPDATA%\mecharm\cache-test'
